<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mates · Gestión</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ec;--card:#fff;--ink:#1c2420;--mut:#66726b;--g:#1f5c42;--warn:#b7791f;--line:#d6ddd6}
@media(prefers-color-scheme:dark){:root{--bg:#141a16;--card:#1d2520;--ink:#e7ede8;--mut:#93a198;--g:#6fcf9d;--warn:#e0a94a;--line:#2e3a33}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Manrope,system-ui,sans-serif}
header{display:flex;gap:6px;align-items:center;padding:10px 14px;background:var(--g);color:#fff;position:sticky;top:0;flex-wrap:wrap}
header b{font-weight:800;margin-right:auto}
nav button{background:transparent;color:#fff;border:0;padding:8px 12px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;opacity:.75}
nav button.on{background:rgba(255,255,255,.2);opacity:1}
main{max-width:760px;margin:0 auto;padding:14px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
input,select,button{font:inherit;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input,select{flex:1;min-width:110px}
button.p{background:var(--g);color:#fff;border-color:var(--g);font-weight:600;cursor:pointer}
button.x{padding:4px 8px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--g);outline-offset:1px}
table{width:100%;border-collapse:collapse}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:600}
td.n,th.n{text-align:right}
.tot{font-size:20px;font-weight:800}
.low{color:var(--warn);font-weight:700}
.msg{color:var(--warn);min-height:20px;margin:6px 0}
.wrap{overflow-x:auto}
</style>
</head>
<body>
<header><b>Mates · Gestión</b><nav id="nav" hidden></nav></header>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// 1) Pegá acá los datos de tu proyecto Supabase (Project Settings > API)
const SB_URL = 'https://rsmrsygckmwuuqnciukq.supabase.co/rest/v1/';
const SB_KEY = 'sb_publishable_MUZuD8FpvQwGOWl5rq4AmQ_8-QdCgwg';

const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);
const money = n => '$' + Number(n || 0).toLocaleString('es-AR');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TABS = {ventas:'Ventas', productos:'Productos', compras:'Compras', caja:'Caja'};
let P = [], S = [], PR = [], cart = [], tab = 'ventas', msg = '';

async function init() {
  const { data } = await sb.auth.getSession();
  data.session ? start() : login();
}

function login() {
  $('#nav').hidden = true;
  $('#app').innerHTML = `<section><h2>Ingresar</h2>
    <div class="row"><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Contraseña"></div>
    <button class="p" id="go">Entrar</button><div class="msg" id="m"></div></section>`;
  $('#go').onclick = async () => {
    const { error } = await sb.auth.signInWithPassword({ email: $('#em').value, password: $('#pw').value });
    error ? $('#m').textContent = 'Email o contraseña incorrectos' : start();
  };
}

async function start() {
  $('#nav').hidden = false;
  $('#nav').innerHTML = Object.entries(TABS).map(([k, v]) => `<button data-t="${k}">${v}</button>`).join('') + '<button id="out">Salir</button>';
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; cart = []; msg = ''; render(); });
  $('#out').onclick = async () => { await sb.auth.signOut(); login(); };
  render();
}

async function load() {
  [P, S, PR] = (await Promise.all([
    sb.from('productos').select('*').order('nombre'),
    sb.from('socios').select('*').order('id'),
    sb.from('proveedores').select('*').order('nombre')
  ])).map(r => r.data || []);
}

async function render() {
  await load();
  document.querySelectorAll('[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  ({ ventas: vVentas, compras: vCompras, productos: vProductos, caja: vCaja })[tab]();
}

const opts = (arr, f) => arr.map(x => `<option value="${x.id}">${esc(f(x))}</option>`).join('');
const total = () => cart.reduce((a, l) => a + l.cant * l.precio, 0);

// ---- Carrito compartido por Ventas y Compras ----
function cartUI(kind) {
  const v = kind === 'v';
  return `<div class="row">
    <select id="pp">${opts(P, p => v ? `${p.nombre} (stock ${p.stock})` : p.nombre)}</select>
    <input id="pc" type="number" min="1" value="1" style="max-width:80px">
    <input id="pe" type="number" min="0" placeholder="${v ? 'Precio' : 'Costo'}">
    <button id="add">Agregar</button></div>
    <div class="wrap"><table>${cart.map((l, i) => `<tr><td>${esc(l.nombre)}</td><td class="n">${l.cant} × ${money(l.precio)}</td>
      <td class="n">${money(l.cant * l.precio)}</td><td><button class="x" data-r="${i}">✕</button></td></tr>`).join('')}</table></div>
    <div class="tot">Total ${money(total())}</div>`;
}
function cartEvents(kind) {
  const fill = () => { const p = P.find(x => x.id == $('#pp').value); if (p) $('#pe').value = kind === 'v' ? p.precio : p.costo; };
  $('#pp').onchange = fill; fill();
  $('#add').onclick = () => {
    const p = P.find(x => x.id == $('#pp').value);
    if (!p) return;
    cart.push({ id: p.id, nombre: p.nombre, cant: +$('#pc').value, precio: +$('#pe').value });
    draw(kind);
  };
  document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { cart.splice(+b.dataset.r, 1); draw(kind); });
}
const draw = kind => (kind === 'v' ? vVentas : vCompras)(true);

// ---- Ventas ----
function vVentas(keep) {
  const saved = keep ? ['mp', 'ep', 'so'].map(i => $('#' + i)?.value) : [];
  $('#app').innerHTML = `<section><h2>Nueva venta</h2>${cartUI('v')}
    <div class="row" style="margin-top:10px">
      <select id="mp"><option>efectivo</option><option>transferencia</option><option>otro</option></select>
      <select id="ep"><option>pagado</option><option>pendiente</option></select>
      <select id="so">${opts(S, s => 'Cobra: ' + s.nombre)}</select></div>
    <button class="p" id="ok">Guardar venta</button><div class="msg">${msg}</div></section>`;
  saved.forEach((val, i) => val && ($('#' + ['mp', 'ep', 'so'][i]).value = val));
  cartEvents('v');
  $('#ok').onclick = async () => {
    if (!cart.length) return;
    const { data: v, error } = await sb.from('ventas').insert({ total: total(), metodo_pago: $('#mp').value, estado_pago: $('#ep').value, socio_cobro_id: +$('#so').value }).select().single();
    if (error) { msg = error.message; return vVentas(true); }
    const { error: e2 } = await sb.from('venta_items').insert(cart.map(l => ({ venta_id: v.id, producto_id: l.id, cantidad: l.cant, precio_unitario: l.precio })));
    if (e2) { await sb.from('ventas').delete().eq('id', v.id); msg = 'No hay stock suficiente'; return vVentas(true); }
    cart = []; msg = 'Venta guardada'; render();
  };
}

// ---- Compras ----
function vCompras(keep) {
  const sv = keep ? $('#pv')?.value : null;
  $('#app').innerHTML = `<section><h2>Nueva compra a proveedor</h2>
    <div class="row"><select id="pv">${opts(PR, p => p.nombre)}</select><button id="np">+ Proveedor</button></div>
    ${cartUI('c')}<button class="p" id="ok" style="margin-top:10px">Guardar compra</button><div class="msg">${msg}</div></section>`;
  if (sv) $('#pv').value = sv;
  cartEvents('c');
  $('#np').onclick = async () => { const n = prompt('Nombre del proveedor'); if (n) { await sb.from('proveedores').insert({ nombre: n }); render(); } };
  $('#ok').onclick = async () => {
    if (!cart.length || !$('#pv').value) { msg = 'Elegí proveedor y productos'; return vCompras(true); }
    const { data: c, error } = await sb.from('compras').insert({ proveedor_id: +$('#pv').value, total: total() }).select().single();
    if (error) { msg = error.message; return vCompras(true); }
    await sb.from('compra_items').insert(cart.map(l => ({ compra_id: c.id, producto_id: l.id, cantidad: l.cant, costo_unitario: l.precio })));
    cart = []; msg = 'Compra guardada, stock actualizado'; render();
  };
}

// ---- Productos ----
function vProductos() {
  $('#app').innerHTML = `<section><h2>Nuevo producto</h2><div class="row">
    <input id="n" placeholder="Nombre"><input id="c" placeholder="Categoría (mate, termo...)">
    <input id="co" type="number" placeholder="Costo"><input id="pr" type="number" placeholder="Precio">
    <input id="st" type="number" placeholder="Stock"></div><button class="p" id="ok">Agregar</button></section>
    <section><h2>Productos</h2><div class="wrap"><table><tr><th>Nombre</th><th class="n">Costo</th><th class="n">Precio</th><th class="n">Stock</th><th></th></tr>
    ${P.map(p => `<tr><td>${esc(p.nombre)}<br><small>${esc(p.categoria)}</small></td><td class="n">${money(p.costo)}</td>
    <td class="n">${money(p.precio)}</td><td class="n ${p.stock <= 2 ? 'low' : ''}">${p.stock}</td>
    <td><button class="x" data-e="${p.id}">Precio</button></td></tr>`).join('')}</table></div></section>`;
  $('#ok').onclick = async () => {
    if (!$('#n').value) return;
    await sb.from('productos').insert({ nombre: $('#n').value, categoria: $('#c').value, costo: +$('#co').value, precio: +$('#pr').value, stock: +$('#st').value });
    render();
  };
  document.querySelectorAll('[data-e]').forEach(b => b.onclick = async () => {
    const p = P.find(x => x.id == b.dataset.e), n = prompt('Nuevo precio de ' + p.nombre, p.precio);
    if (n !== null && n !== '') { await sb.from('productos').update({ precio: +n }).eq('id', p.id); render(); }
  });
}

// ---- Caja ----
async function vCaja(day) {
  day = typeof day === 'string' ? day : new Date().toLocaleDateString('sv');
  const a = new Date(day + 'T00:00:00'), b = new Date(a.getTime() + 864e5);
  const { data } = await sb.from('ventas').select('*').gte('fecha', a.toISOString()).lt('fecha', b.toISOString());
  const V = data || [], paid = V.filter(v => v.estado_pago === 'pagado');
  const sum = f => paid.filter(f).reduce((t, v) => t + +v.total, 0);
  const pend = V.filter(v => v.estado_pago === 'pendiente').reduce((t, v) => t + +v.total, 0);
  $('#app').innerHTML = `<section><h2>Cierre de caja</h2><div class="row"><input id="d" type="date" value="${day}"></div>
    <div class="wrap"><table><tr><th>Socio</th><th class="n">Efectivo</th><th class="n">Transfer.</th><th class="n">Otro</th><th class="n">Total</th></tr>
    ${S.map(s => { const f = m => sum(v => v.socio_cobro_id == s.id && v.metodo_pago === m);
      return `<tr><td>${esc(s.nombre)}</td><td class="n">${money(f('efectivo'))}</td><td class="n">${money(f('transferencia'))}</td><td class="n">${money(f('otro'))}</td><td class="n"><b>${money(f('efectivo') + f('transferencia') + f('otro'))}</b></td></tr>`; }).join('')}
    <tr><td><b>Todos</b></td><td class="n">${money(sum(v => v.metodo_pago === 'efectivo'))}</td><td class="n">${money(sum(v => v.metodo_pago === 'transferencia'))}</td><td class="n">${money(sum(v => v.metodo_pago === 'otro'))}</td><td class="n tot">${money(sum(() => true))}</td></tr></table></div>
    <p>Pendiente de cobro: <b class="low">${money(pend)}</b> · Ventas del día: ${V.length}</p></section>`;
  $('#d').onchange = e => vCaja(e.target.value);
}

init();
</script>
</body>
</html>
