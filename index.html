/* Ritual · gestión. Estilo "libro contable": sin color en el chrome, un solo verde yerba sobre el dato principal.
   Grilla: sidebar 232 + canvas fluido, gutter 32 / 16. Radio 4 en todo (decidido una vez). Sin sombras, sin degradados. */
:root{--ground:#f3f3f1;--surface:#fff;--active:#ececea;--border:#e5e5e2;--rule:#eeeeec;--control:#cdcdc8;
--text:#24221d;--muted:#5e5b52;--faint:#6b675d;--primary:#2a2823;--accent:#3d6b3a;--warn:#8a5a00;--r:4px;--h:34px}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font:14px/20px 'Public Sans',system-ui,sans-serif;font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 12px;border-right:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px;font:800 20px/1 Fraunces,Georgia,serif;letter-spacing:-.01em}
.brand small{display:block;font:400 12px/16px 'Public Sans',sans-serif;color:var(--muted);letter-spacing:0;margin-top:3px}
#nav{display:flex;flex-direction:column;gap:2px;flex:1}
#nav button{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border:0;border-radius:6px;background:none;color:var(--muted);font:inherit;cursor:pointer;text-align:left}
#nav button:hover{background:var(--rule);color:var(--text)}
#nav button.on{background:var(--active);color:var(--text)}
#nav svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#nav .sep{margin-top:auto;border-top:1px solid var(--border);padding-top:8px}
#nav a{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;color:var(--muted);text-decoration:none}
#nav a:hover{color:var(--text)}
main{padding:32px;min-width:0}
#head{margin-bottom:24px}
h1{margin:0;font:600 24px/32px 'Public Sans',sans-serif;letter-spacing:-.01em}
#head p{margin:2px 0 0;color:var(--muted)}
#app{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
#app.caja{grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch}
#app.clientes{grid-template-columns:minmax(0,1fr) 320px}
#app.caja>section:nth-child(n+3){grid-column:1/-1}
#app.clientes>section:first-child{order:2}
section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin:0}
h2{margin:0 0 12px;font:600 16px/24px 'Public Sans',sans-serif}
small,.msg{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
input,select,button{font:inherit;height:var(--h);padding:0 10px;border-radius:var(--r);border:1px solid var(--control);background:var(--surface);color:var(--text)}
input,select{flex:1;min-width:110px}
input::placeholder{color:var(--faint)}
button{cursor:pointer}
button:hover{border-color:var(--text)}
button.p{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
button.p:hover{background:#000}
button.x{height:28px;padding:0 10px;font-size:13px;border-color:var(--border)}
button.x:hover{border-color:var(--control)}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
table{width:100%;border-collapse:collapse}
th{padding:0 8px 8px;text-align:left;font-weight:400;font-size:12px;color:var(--muted)}
td{padding:12px 8px;border-top:1px solid var(--rule);vertical-align:middle}
td:first-child,th:first-child{padding-left:0}td:last-child,th:last-child{padding-right:0}
td.n,th.n{text-align:right}
td small{display:block}
.wrap{overflow-x:auto}
.tot{font:600 28px/36px 'Public Sans',sans-serif;letter-spacing:-.01em}
#app.caja .tot{color:var(--accent)}
.faint{color:var(--faint)}
#app.ventas .tot,#app.compras .tot{font-size:18px;line-height:28px;color:var(--text)}
.low{color:var(--warn);font-weight:600}
.msg{min-height:20px;margin:8px 0 0;color:var(--warn)}
#hist .row{padding:12px 0;margin:0;border-top:1px solid var(--rule)}
#hist h2+.row,#histc h2+.row{border-top:0}
#fac{position:fixed;inset:0;background:rgba(36,34,29,.45);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:32px 16px;z-index:9}
#fac .doc{background:#fff;color:#111;max-width:380px;width:100%;padding:20px;border-radius:var(--r);font:13px/20px ui-monospace,Menlo,monospace}
#fac hr{border:0;border-top:1px dashed #999;margin:8px 0}
#fac td{border:0;padding:2px 0}
#fac button{font-family:'Public Sans',sans-serif}
body.out aside{display:none}body.out .shell{display:block}
body.out #head{display:none}body.out main{max-width:400px;margin:12vh auto 0}
body.out .brand{padding:0 0 20px;font-size:28px}
@media print{aside,main{display:none}.shell{display:block}#fac{position:static;background:none;padding:0}#fac .no{display:none}}
@media(max-width:760px){
.shell{display:block}
aside{position:static;height:auto;padding:12px 16px 0;border:0;border-bottom:1px solid var(--border)}
.brand{padding-bottom:8px}
#nav{flex-direction:row;overflow-x:auto;gap:0;flex:none}
#nav button{height:44px;border-radius:0;flex:none;border-bottom:2px solid transparent}
#nav button.on{background:none;border-bottom-color:var(--text)}
#nav .sep{margin:0;border:0;padding:0}#nav a{display:none}
main{padding:20px 16px}
#app.caja,#app.productos,#app.clientes{grid-template-columns:minmax(0,1fr)}
#app.productos>section:first-child,#app.clientes>section:first-child{order:0}
input,select{min-width:0;flex:1 1 140px}
button,button.x{min-height:44px}
}
</style>
</head>
<body>
<div class="shell"><aside><div class="brand" id="brand"></div><nav id="nav" hidden></nav></aside><main><div id="head"></div><div id="app"></div></main></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// 1) Pegá acá los datos de tu proyecto Supabase (Project Settings > API)
const SB_URL = 'https://rsmrsygckmwuuqnciukq.supabase.co';
const SB_KEY = 'sb_publishable_MUZuD8FpvQwGOWl5rq4AmQ_8-QdCgwg';

const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);
const money = n => '$' + Number(n || 0).toLocaleString('es-AR');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P1 = {
  ventas: '<path d="M5 4h14v16l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 9h6M9 13h6"/>',
  clientes: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/>',
  productos: '<path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/>',
  compras: '<path d="M3 6h2l2 10h10l2-7H7"/><circle cx="9" cy="19" r="1"/><circle cx="17" cy="19" r="1"/>',
  caja: '<rect x="3" y="6" width="18" height="13" rx="1"/><path d="M3 10h18M16 15h2"/>',
  cat: '<path d="M10 6H6a2 2 0 0 0-2 2v10h12v-4M13 4h7v7M20 4l-9 9"/>',
  out: '<path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h9"/>'
};
const svg = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${P1[k]}</svg>`;
const BRAND_HTML = '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 11h12c0 5-2 9-6 9s-6-4-6-9z"/><path d="M12 11l4-8"/></svg><span>Ritual<small>Mates · 3 socios</small></span>';
const TABS = {ventas:'Ventas', clientes:'Clientes', productos:'Productos', compras:'Compras', caja:'Caja'};
let PALL = [], P = [], S = [], PR = [], C = [], cart = [], tab = 'ventas', msg = '';

async function init() {
  $('#brand').innerHTML = BRAND_HTML;
  const { data } = await sb.auth.getSession();
  data.session ? start() : login();
}

function login() {
  $('#nav').hidden = true; document.body.classList.add('out'); $('#app').className = '';
  $('#app').innerHTML = `<div class="brand">${BRAND_HTML}</div><section><h2>Ingresar</h2>
    <div class="row"><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Contraseña"></div>
    <button class="p" id="go">Entrar</button><div class="msg" id="m"></div></section>`;
  $('#go').onclick = async () => {
    const { error } = await sb.auth.signInWithPassword({ email: $('#em').value, password: $('#pw').value });
    error ? $('#m').textContent = 'Email o contraseña incorrectos' : start();
  };
}

async function start() {
  $('#nav').hidden = false; document.body.classList.remove('out');
  $('#nav').innerHTML = Object.entries(TABS).map(([k, v]) => `<button data-t="${k}">${svg(k)}${v}</button>`).join('') + `<div class="sep"><a href="catalogo.html" target="_blank">${svg('cat')}Catálogo</a><button id="out">${svg('out')}Salir</button></div>`;
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; cart = []; msg = ''; render(); });
  $('#out').onclick = async () => { await sb.auth.signOut(); login(); };
  render();
}

async function load() {
  [P, S, PR, C] = (await Promise.all([
    sb.from('productos').select('*').order('nombre'),
    sb.from('socios').select('*').order('id'),
    sb.from('proveedores').select('*').order('nombre'),
    sb.from('clientes').select('*').order('nombre')
  ])).map(r => r.data || []);
  PALL = P; P = PALL.filter(p => p.activo);
}

const sub = () => ({
  ventas: new Date().toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' }),
  clientes: `${C.length} clientes registrados`,
  productos: `${P.length} activos · ${P.filter(p => p.stock <= 2).length} con stock bajo`,
  compras: `${PR.length} proveedores`,
  caja: 'Saldos acumulados; con una fecha, desde ese día'
})[tab];
async function hoy() {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  const { data } = await sb.from('ventas').select('total,estado_pago').gte('fecha', d.toISOString());
  const v = data || [], f = e => v.filter(x => x.estado_pago === e).reduce((t, x) => t + +x.total, 0), pen = f('pendiente');
  return `Hoy: ${v.length} ${v.length === 1 ? 'venta' : 'ventas'} · ${money(f('pagado'))} cobrado${pen ? ' · ' + money(pen) + ' pendiente' : ''}`;
}
async function render() {
  await load();
  $('#app').className = tab;
  $('#head').innerHTML = `<h1>${TABS[tab]}</h1><p>${tab === 'ventas' ? await hoy() : sub()}</p>`;
  document.querySelectorAll('[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  ({ ventas: vVentas, compras: vCompras, productos: vProductos, caja: vCaja, clientes: vClientes })[tab]();
}

const opts = (arr, f) => arr.map(x => `<option value="${x.id}">${esc(f(x))}</option>`).join('');
const total = () => cart.reduce((a, l) => a + l.cant * l.precio, 0);

// ---- Carrito compartido por Ventas y Compras ----
function cartUI(kind) {
  const v = kind === 'v';
  return `<div class="row">
    <select id="pp">${opts(P, p => v ? `${p.nombre} (stock ${p.stock})` : p.nombre)}</select>
    <input id="pc" type="number" min="1" value="1" style="max-width:80px">
    <input id="pe" type="number" min="0" placeholder="${v ? 'Precio' : 'Costo'}">
    <button id="add">Agregar</button></div>
    <div class="wrap"><table>${cart.map((l, i) => `<tr><td>${esc(l.nombre)}</td><td class="n">${l.cant} × ${money(l.precio)}</td>
      <td class="n">${money(l.cant * l.precio)}</td><td><button class="x" data-r="${i}">Quitar</button></td></tr>`).join('')}</table></div>
    <div class="tot">Total ${money(total())}</div>`;
}
function cartEvents(kind) {
  const fill = () => { const p = P.find(x => x.id == $('#pp').value); if (p) $('#pe').value = kind === 'v' ? p.precio : p.costo; };
  $('#pp').onchange = fill; fill();
  $('#add').onclick = () => {
    const p = P.find(x => x.id == $('#pp').value);
    if (!p) return;
    cart.push({ id: p.id, nombre: p.nombre, cant: +$('#pc').value, precio: +$('#pe').value });
    draw(kind);
  };
  document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { cart.splice(+b.dataset.r, 1); draw(kind); });
}
const draw = kind => (kind === 'v' ? vVentas : vCompras)(true);

// ---- Ventas ----
function vVentas(keep) {
  const saved = keep ? ['mp', 'ep', 'so', 'cl'].map(i => $('#' + i)?.value) : [];
  $('#app').innerHTML = `<section><h2>Nueva venta</h2>${cartUI('v')}
    <div class="row" style="margin-top:10px">
      <select id="mp"><option>efectivo</option><option>transferencia</option><option>otro</option></select>
      <select id="ep"><option>pagado</option><option>pendiente</option></select>
      <select id="so">${opts(S, s => 'Cobra: ' + s.nombre)}</select></div>
    <div class="row"><select id="cl"><option value="">Cliente: sin datos</option>${opts(C, c => c.nombre)}</select><button id="nc">+ Cliente</button></div>
    <button class="p" id="ok">Guardar venta</button><div class="msg">${msg}</div></section>`;
  saved.forEach((val, i) => val && ($('#' + ['mp', 'ep', 'so', 'cl'][i]).value = val));
  cartEvents('v'); hist(); $('#nc').onclick = nuevoCliente;
  $('#ok').onclick = async () => {
    if (!cart.length) return;
    const { data: v, error } = await sb.from('ventas').insert({ total: total(), metodo_pago: $('#mp').value, estado_pago: $('#ep').value, socio_cobro_id: +$('#so').value, cliente_id: $('#cl').value ? +$('#cl').value : null }).select().single();
    if (error) { msg = error.message; return vVentas(true); }
    const { error: e2 } = await sb.from('venta_items').insert(cart.map(l => ({ venta_id: v.id, producto_id: l.id, cantidad: l.cant, precio_unitario: l.precio })));
    if (e2) { await sb.from('ventas').delete().eq('id', v.id); msg = 'No hay stock suficiente'; return vVentas(true); }
    cart = []; msg = 'Venta guardada'; await render(); verFactura(v.id);
  };
}

// ---- Compras ----
function vCompras(keep) {
  const sv = keep ? $('#pv')?.value : null, sm = keep ? $('#cm')?.value : null, ss = keep ? $('#cs')?.value : null;
  $('#app').innerHTML = `<section><h2>Nueva compra a proveedor</h2>
    <div class="row"><select id="pv">${opts(PR, p => p.nombre)}</select><button id="np">+ Proveedor</button></div>
    ${cartUI('c')}<div class="row" style="margin-top:10px"><select id="cm"><option value="efectivo">Pagó en efectivo</option><option value="transferencia">Pagó por transferencia</option></select><select id="cs">${opts(S, s => 'Pagó: ' + s.nombre)}</select></div><button class="p" id="ok">Guardar compra</button><div class="msg">${msg}</div></section>`;
  if (sv) $('#pv').value = sv; if (sm) $('#cm').value = sm; if (ss) $('#cs').value = ss;
  cartEvents('c'); histC();
  $('#np').onclick = async () => { const n = prompt('Nombre del proveedor'); if (n) { await sb.from('proveedores').insert({ nombre: n, telefono: prompt('Teléfono (opcional)') || '' }); render(); } };
  $('#ok').onclick = async () => {
    if (!cart.length || !$('#pv').value) { msg = 'Elegí proveedor y productos'; return vCompras(true); }
    const { data: c, error } = await sb.from('compras').insert({ proveedor_id: +$('#pv').value, total: total(), metodo_pago: $('#cm').value, socio_pago_id: +$('#cs').value }).select().single();
    if (error) { msg = error.message; return vCompras(true); }
    await sb.from('compra_items').insert(cart.map(l => ({ compra_id: c.id, producto_id: l.id, cantidad: l.cant, costo_unitario: l.precio })));
    cart = []; msg = 'Compra guardada, stock actualizado'; await render(); verTicketCompra(c.id);
  };
}

// ---- Historial de ventas (editar / anular) ----
async function hist() {
  const { data } = await sb.from('ventas').select('*, clientes(nombre), venta_items(cantidad, productos(nombre))').order('fecha', { ascending: false }).limit(30);
  if (tab !== 'ventas') return;
  const MP = ['efectivo', 'transferencia', 'otro'].map(x => [x, x]), EP = ['pagado', 'pendiente'].map(x => [x, x]), SO = S.map(s => [s.id, s.nombre]), CL = [['', 'Sin cliente'], ...C.map(c => [c.id, c.nombre])];
  const sel = (id, f, cur, list) => `<select data-v="${id}" data-f="${f}">${list.map(o => `<option value="${o[0]}" ${o[0] == cur ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`;
  const el = document.createElement('section'); el.id = 'hist';
  el.innerHTML = `<h2>Últimas ventas</h2><div class="wrap"><table><tr><th>Fecha</th><th>Cliente y detalle</th><th>Pago</th><th>Cobra</th><th class="n">Total</th><th></th></tr>${(data || []).map(v => `<tr><td>${new Date(v.fecha).toLocaleString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</td>
    <td>${v.clientes ? esc(v.clientes.nombre) : '<span class="faint">Sin cliente</span>'}<small>${v.venta_items.map(i => i.cantidad + '× ' + esc(i.productos?.nombre)).join(', ')}</small></td>
    <td>${v.metodo_pago}${v.estado_pago === 'pendiente' ? ' · <span class="low">pendiente</span>' : ''}</td><td>${esc(S.find(x => x.id == v.socio_cobro_id)?.nombre)}</td><td class="n">${money(v.total)}</td>
    <td class="n" style="white-space:nowrap"><button class="x" data-fac="${v.id}">Factura</button> ${v.estado_pago === 'pendiente' ? `<button class="x" data-cob="${v.id}" data-m="${v.metodo_pago}">Cobrar</button> ` : ''}<button class="x" data-del="${v.id}">Anular</button></td></tr>`).join('') || '<tr><td colspan="6">Todavía no hay ventas.</td></tr>'}</table></div>`;
  $('#hist')?.remove(); $('#app').append(el);
  el.querySelectorAll('[data-fac]').forEach(b => b.onclick = () => verFactura(b.dataset.fac));
  el.querySelectorAll('[data-cob]').forEach(b => b.onclick = async () => {
    const m = prompt('Forma de pago (efectivo / transferencia / otro)', b.dataset.m);
    if (!['efectivo', 'transferencia', 'otro'].includes(m)) return;
    await sb.from('ventas').update({ estado_pago: 'pagado', metodo_pago: m }).eq('id', b.dataset.cob); render();
  });
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (confirm('¿Anular esta venta? El stock vuelve.')) { await sb.from('ventas').delete().eq('id', b.dataset.del); render(); }
  });
}

// ---- Productos ----
function vProductos() {
  $('#app').innerHTML = `<section><h2>Nuevo producto</h2><div class="row">
    <input id="n" placeholder="Nombre"><input id="c" placeholder="Categoría (mate, termo...)">
    <input id="co" type="number" placeholder="Costo"><input id="pr" type="number" placeholder="Precio">
    <input id="st" type="number" placeholder="Stock"></div><button class="p" id="ok">Agregar</button></section>
    <section><h2>Productos</h2><div class="wrap"><table><tr><th>Nombre</th><th class="n">Costo</th><th class="n">Precio</th><th class="n">Stock</th><th></th></tr>
    ${PALL.map(p => `<tr style="${p.activo ? '' : 'opacity:.45'}"><td>${esc(p.nombre)}<br><small>${esc(p.categoria)}</small></td><td class="n">${money(p.costo)}</td>
    <td class="n">${money(p.precio)}</td><td class="n ${p.stock <= 2 ? 'low' : ''}">${p.stock}</td>
    <td><button class="x" data-e="${p.id}">Editar</button> <button class="x" data-ph="${p.id}">Foto${p.foto_url ? ' ✓' : ''}</button> <button class="x" data-cat="${p.id}">${p.en_catalogo ? 'En catálogo ✓' : 'Al catálogo'}</button> <button class="x" data-b="${p.id}">${p.activo ? 'Baja' : 'Alta'}</button></td></tr>`).join('')}</table></div></section>`;
  $('#ok').onclick = async () => {
    if (!$('#n').value) return;
    await sb.from('productos').insert({ nombre: $('#n').value, categoria: $('#c').value, costo: +$('#co').value, precio: +$('#pr').value, stock: +$('#st').value });
    render();
  };
  document.querySelectorAll('[data-e]').forEach(b => b.onclick = async () => {
    const p = PALL.find(x => x.id == b.dataset.e);
    const n = prompt('Nombre', p.nombre); if (n === null) return;
    const c = prompt('Categoría', p.categoria || ''), co = prompt('Costo', p.costo), pr = prompt('Precio', p.precio), st = prompt('Stock', p.stock);
    if ([c, co, pr, st].includes(null)) return;
    await sb.from('productos').update({ nombre: n, categoria: c, costo: +co, precio: +pr, stock: +st }).eq('id', p.id); render();
  });
  document.querySelectorAll('[data-b]').forEach(b => b.onclick = async () => {
    const p = PALL.find(x => x.id == b.dataset.b);
    await sb.from('productos').update({ activo: !p.activo }).eq('id', p.id); render();
  });
  document.querySelectorAll('[data-cat]').forEach(b => b.onclick = async () => {
    const p = PALL.find(x => x.id == b.dataset.cat);
    await sb.from('productos').update({ en_catalogo: !p.en_catalogo }).eq('id', p.id); render();
  });
  document.querySelectorAll('[data-ph]').forEach(b => b.onclick = () => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*';
    i.onchange = async () => {
      if (!i.files[0]) return;
      const path = `p${b.dataset.ph}-${Date.now()}.jpg`;
      const { error } = await sb.storage.from('fotos').upload(path, await comprimir(i.files[0]), { contentType: 'image/jpeg' });
      if (error) return alert(error.message);
      await sb.from('productos').update({ foto_url: sb.storage.from('fotos').getPublicUrl(path).data.publicUrl }).eq('id', b.dataset.ph); render();
    };
    i.click();
  });
}

// ---- Caja ----
async function vCaja(desde) {
  desde = typeof desde === 'string' ? desde : '';
  const f = q => desde ? q.gte('fecha', new Date(desde + 'T00:00:00').toISOString()) : q;
  const [{ data: V }, { data: D }, { data: CP }] = await Promise.all([f(sb.from('ventas').select('*')), f(sb.from('depositos').select('*')).order('fecha', { ascending: false }), f(sb.from('compras').select('*'))]);
  const paid = (V || []).filter(v => v.estado_pago === 'pagado'), dep = D || [];
  const sum = (arr, fn, k = 'total') => arr.filter(fn).reduce((t, x) => t + +x[k], 0);
  const trans = sum(paid, v => v.metodo_pago === 'transferencia'), otro = sum(paid, v => v.metodo_pago === 'otro'), depT = sum(dep, () => true, 'monto');
  const cp = CP || [], cpT = sum(cp, c => c.metodo_pago === 'transferencia'), efe = s => sum(paid, v => v.metodo_pago === 'efectivo' && v.socio_cobro_id == s.id) - sum(dep, d => d.socio_id == s.id, 'monto') - sum(cp, c => c.metodo_pago === 'efectivo' && c.socio_pago_id == s.id);
  $('#app').innerHTML = `<section><h2>Ventas</h2><div class="row"><input id="d" type="date" value="${desde}"><small style="align-self:center">Desde (vacío = todo)</small></div>
    <div>Cobrado: <span class="tot">${money(sum(paid, () => true))}</span></div>
    <div>Pendiente de cobro: <b class="low">${money(sum(V || [], v => v.estado_pago === 'pendiente'))}</b></div><table style="margin-top:8px"><tr><td>Cobrado en efectivo</td><td class="n">${money(sum(paid, v => v.metodo_pago === 'efectivo'))}</td></tr><tr><td>Cobrado por transferencia</td><td class="n">${money(trans)}</td></tr>${otro ? `<tr><td>Otros medios</td><td class="n">${money(otro)}</td></tr>` : ''}</table></section>
    <section><h2>Cuenta bancaria</h2><div class="tot">${money(trans + depT - cpT)}</div>
    <table><tr><td>Transferencias cobradas</td><td class="n">${money(trans)}</td></tr><tr><td>Depósitos de socios</td><td class="n">${money(depT)}</td></tr><tr><td>Compras pagadas por transferencia</td><td class="n">−${money(cpT)}</td></tr></table>${otro ? `<small>Otros medios, no incluidos: ${money(otro)}</small>` : ''}</section>
    <section><h2>Efectivo por socio</h2><div class="wrap"><table><tr><th>Socio</th><th class="n">Cobró en efectivo</th><th class="n">Pagó compras</th><th class="n">Depositó</th><th class="n">Debería tener</th><th></th></tr>${S.map(s => { const c = sum(paid, v => v.metodo_pago === 'efectivo' && v.socio_cobro_id == s.id), g = sum(cp, x => x.metodo_pago === 'efectivo' && x.socio_pago_id == s.id), d = sum(dep, x => x.socio_id == s.id, 'monto'); return `<tr><td>${esc(s.nombre)}</td><td class="n">${money(c)}</td><td class="n">${money(g)}</td><td class="n">${money(d)}</td><td class="n"><b>${money(c - g - d)}</b></td><td class="n"><button class="x" data-pay="${s.id}">Depositar saldo</button></td></tr>`; }).join('')}</table></div></section>
    <section><h2>Depósitos</h2>${dep.map(d => `<div class="row"><span style="flex:1">${new Date(d.fecha).toLocaleDateString('es-AR')} · ${esc(S.find(s => s.id == d.socio_id)?.nombre)}</span>
    <b>${money(d.monto)}</b><button class="x" data-dd="${d.id}">Borrar</button></div>`).join('') || '<small>Sin depósitos</small>'}</section>`;
  $('#d').onchange = e => vCaja(e.target.value);
  document.querySelectorAll('[data-pay]').forEach(b => b.onclick = async () => {
    const s = S.find(x => x.id == b.dataset.pay), m = prompt(`Depositar en la cuenta bancaria. Efectivo de ${s.nombre}: ${money(efe(s))}`, Math.max(efe(s), 0));
    if (!m || +m <= 0) return;
    await sb.from('depositos').insert({ socio_id: s.id, monto: +m }); vCaja(desde);
  });
  document.querySelectorAll('[data-dd]').forEach(b => b.onclick = async () => {
    if (confirm('¿Borrar este depósito?')) { await sb.from('depositos').delete().eq('id', b.dataset.dd); vCaja(desde); }
  });
}

// ---- Clientes ----
async function nuevoCliente() {
  const n = prompt('Nombre del cliente'); if (!n) return;
  const t = prompt('Teléfono (opcional)') || '';
  await sb.from('clientes').insert({ nombre: n, telefono: t }); render();
}
async function vClientes() {
  const { data } = await sb.from('ventas').select('cliente_id,total,estado_pago').not('cliente_id', 'is', null);
  const agg = id => {
    const L = (data || []).filter(v => v.cliente_id == id);
    return { n: L.length, t: L.reduce((s, v) => s + +v.total, 0), p: L.filter(v => v.estado_pago === 'pendiente').reduce((s, v) => s + +v.total, 0) };
  };
  $('#app').innerHTML = `<section><h2>Nuevo cliente</h2><p class="faint" style="margin:0 0 12px">Nombre y teléfono. Después lo elegís en cada venta.</p><button class="p" id="nc">Agregar cliente</button></section>
    <section><div class="wrap"><table><tr><th>Cliente</th><th class="n">Compras</th><th class="n">Total</th><th class="n">Debe</th><th></th></tr>
    ${C.map(c => { const a = agg(c.id); return `<tr><td>${esc(c.nombre)}<br><small>${esc(c.telefono)}</small></td><td class="n">${a.n}</td><td class="n">${money(a.t)}</td>
    <td class="n ${a.p ? 'low' : ''}">${money(a.p)}</td><td><button class="x" data-ec="${c.id}">Editar</button> <button class="x" data-dc="${c.id}">Borrar</button></td></tr>`; }).join('') || '<tr><td>Sin clientes todavía</td></tr>'}</table></div></section>`;
  $('#nc').onclick = nuevoCliente;
  document.querySelectorAll('[data-ec]').forEach(b => b.onclick = async () => {
    const c = C.find(x => x.id == b.dataset.ec), n = prompt('Nombre', c.nombre); if (n === null) return;
    const t = prompt('Teléfono', c.telefono || ''); if (t === null) return;
    await sb.from('clientes').update({ nombre: n, telefono: t }).eq('id', c.id); render();
  });
  document.querySelectorAll('[data-dc]').forEach(b => b.onclick = async () => {
    if (confirm('¿Borrar cliente? Sus ventas quedan sin cliente.')) { await sb.from('clientes').delete().eq('id', b.dataset.dc); render(); }
  });
}

// ---- Comprobante de venta ----
async function verFactura(id) {
  const { data: v } = await sb.from('ventas').select('*, clientes(nombre,telefono), socios(nombre), venta_items(cantidad, precio_unitario, productos(nombre))').eq('id', id).single();
  if (!v) return;
  $('#fac')?.remove();
  const el = document.createElement('div'); el.id = 'fac';
  el.innerHTML = `<div class="doc"><b style="font-size:16px">COMPROBANTE DE VENTA</b><br>N° ${String(v.id).padStart(6, '0')}<br>${new Date(v.fecha).toLocaleString('es-AR')}<hr>
    ${v.clientes ? `Cliente: ${esc(v.clientes.nombre)}${v.clientes.telefono ? ' · Tel ' + esc(v.clientes.telefono) : ''}<br>` : ''}Cobró: ${esc(v.socios?.nombre)}<hr>
    <table style="width:100%">${v.venta_items.map(i => `<tr><td>${i.cantidad} × ${esc(i.productos?.nombre)}</td><td style="text-align:right">${money(i.cantidad * i.precio_unitario)}</td></tr>
    <tr><td colspan="2" style="color:#666">&nbsp;&nbsp;${money(i.precio_unitario)} c/u</td></tr>`).join('')}</table><hr>
    <b style="font-size:16px">TOTAL ${money(v.total)}</b><br>Pago: ${v.metodo_pago} · ${v.estado_pago.toUpperCase()}<hr>
    <small>Comprobante interno, no válido como factura fiscal.</small>
    <div class="row no" style="margin-top:12px"><button class="p" id="fp">Imprimir / PDF</button><button id="fw">WhatsApp</button><button id="fc">Cerrar</button></div></div>`;
  document.body.append(el);
  const txtV = `*Comprobante de venta N° ${String(v.id).padStart(6, '0')}*\n${new Date(v.fecha).toLocaleDateString('es-AR')}\n` + (v.clientes ? `Cliente: ${v.clientes.nombre}\n` : '') + '\n' + v.venta_items.map(i => `${i.cantidad} × ${i.productos?.nombre} — ${money(i.cantidad * i.precio_unitario)}`).join('\n') + `\n\n*Total: ${money(v.total)}*\nPago: ${v.metodo_pago} (${v.estado_pago})\n¡Gracias por tu compra!`;
  $('#fw').onclick = () => wa(txtV, v.clientes?.telefono);
  $('#fp').onclick = () => window.print();
  $('#fc').onclick = () => el.remove();
}

// ---- WhatsApp, fotos y tickets de compra ----
const wa = (txt, tel) => {
  let n = (tel || '').replace(/\D/g, ''); if (n.length === 10) n = '549' + n;
  window.open(`https://wa.me/${n}?text=${encodeURIComponent(txt)}`, '_blank');
};
async function comprimir(f) {
  const img = await createImageBitmap(f), k = Math.min(1, 800 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k;
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.8));
}
async function histC() {
  const { data } = await sb.from('compras').select('*, proveedores(nombre)').order('id', { ascending: false }).limit(15);
  if (tab !== 'compras') return;
  const el = document.createElement('section'); el.id = 'histc';
  el.innerHTML = `<h2>Últimas compras</h2><div class="wrap"><table><tr><th>Fecha</th><th>Proveedor</th><th>Pago</th><th class="n">Total</th><th></th></tr>${(data || []).map(c => `<tr><td>${new Date(c.fecha + 'T00:00:00').toLocaleDateString('es-AR')}</td><td>${esc(c.proveedores?.nombre)}</td><td>${c.metodo_pago}</td><td class="n">${money(c.total)}</td><td class="n"><button class="x" data-tc="${c.id}">Ticket</button></td></tr>`).join('') || '<tr><td colspan="5">Todavía no hay compras.</td></tr>'}</table></div>`;
  $('#histc')?.remove(); $('#app').append(el);
  el.querySelectorAll('[data-tc]').forEach(b => b.onclick = () => verTicketCompra(b.dataset.tc));
}
async function verTicketCompra(id) {
  const { data: c } = await sb.from('compras').select('*, proveedores(nombre,telefono), socios(nombre), compra_items(cantidad, costo_unitario, productos(nombre))').eq('id', id).single();
  if (!c) return;
  $('#fac')?.remove();
  const n = String(c.id).padStart(6, '0'), fe = new Date(c.fecha + 'T00:00:00').toLocaleDateString('es-AR');
  const pago = c.metodo_pago === 'efectivo' ? `efectivo (${c.socios?.nombre})` : 'transferencia';
  const txt = `*Orden de compra N° ${n}*\n${fe}\n\n` + c.compra_items.map(i => `${i.cantidad} × ${i.productos?.nombre} — ${money(i.cantidad * i.costo_unitario)}`).join('\n') + `\n\n*Total: ${money(c.total)}*\nPago: ${pago}`;
  const el = document.createElement('div'); el.id = 'fac';
  el.innerHTML = `<div class="doc"><b style="font-size:16px">COMPRA A PROVEEDOR</b><br>N° ${n} · ${fe}<hr>Proveedor: ${esc(c.proveedores?.nombre)}<hr>
    <table style="width:100%">${c.compra_items.map(i => `<tr><td>${i.cantidad} × ${esc(i.productos?.nombre)}</td><td style="text-align:right">${money(i.cantidad * i.costo_unitario)}</td></tr>`).join('')}</table><hr>
    <b style="font-size:16px">TOTAL ${money(c.total)}</b><br>Pago: ${esc(pago)}<hr>
    <div class="row no"><button class="p" id="fp">Imprimir / PDF</button><button id="fw">WhatsApp</button><button id="fc">Cerrar</button></div></div>`;
  document.body.append(el);
  $('#fp').onclick = () => window.print(); $('#fc').onclick = () => el.remove();
  $('#fw').onclick = () => wa(txt, c.proveedores?.telefono);
}

init();
</script>
