<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo de mates</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ec;--card:#fff;--ink:#1c2420;--mut:#66726b;--g:#1f5c42;--warn:#b7791f;--line:#d6ddd6}
@media(prefers-color-scheme:dark){:root{--bg:#141a16;--card:#1d2520;--ink:#e7ede8;--mut:#93a198;--g:#6fcf9d;--warn:#e0a94a;--line:#2e3a33}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Manrope,system-ui,sans-serif;padding-bottom:80px}
header{background:var(--g);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:5}
header b{font-size:18px;font-weight:800}
#cats{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
#cats button{flex:none;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:99px;padding:5px 12px;font:inherit;cursor:pointer}
#cats button.on{background:#fff;color:var(--g);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;max-width:900px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card img,.ph{width:100%;aspect-ratio:1;object-fit:cover;background:var(--line)}
.b{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
h3{margin:0;font-size:14px}
.pr{font-weight:800;font-size:17px}
.sin{color:var(--warn);font-weight:600;font-size:13px}
button{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px;cursor:pointer}
button.p{background:var(--g);color:#fff;border-color:var(--g);font-weight:600;margin-top:auto}
.q{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
button:focus-visible{outline:2px solid var(--g);outline-offset:2px}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center}
#bar span{flex:1;font-weight:600}
</style>
</head>
<body>
<header><b>Catálogo de mates</b><div id="cats"></div></header>
<div class="grid" id="grid"></div>
<div id="bar" hidden><span id="tot"></span><button id="lim">Vaciar</button><button class="p" id="env" style="margin:0">Pedir por WhatsApp</button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Número de WhatsApp del negocio, con código de país y sin signos. Ej: 5493531234567
const WA = '5493532448101';
const sb = supabase.createClient('https://rsmrsygckmwuuqnciukq.supabase.co', 'sb_publishable_MUZuD8FpvQwGOWl5rq4AmQ_8-QdCgwg');
const $ = s => document.querySelector(s);
const money = n => '$' + Number(n || 0).toLocaleString('es-AR');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let L = [], cat = 'Todos', cart = {};

async function init() {
  const { data } = await sb.from('catalogo').select('*').order('nombre');
  L = data || []; draw();
}

function draw() {
  const cats = ['Todos', ...new Set(L.map(p => p.categoria).filter(Boolean))];
  $('#cats').innerHTML = cats.map(c => `<button class="${c === cat ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  $('#grid').innerHTML = L.filter(p => cat === 'Todos' || p.categoria === cat).map(p => {
    const n = cart[p.id] || 0;
    return `<article class="card">${p.foto_url ? `<img src="${esc(p.foto_url)}" alt="${esc(p.nombre)}" loading="lazy">` : '<div class="ph"></div>'}
      <div class="b"><h3>${esc(p.nombre)}</h3><div class="pr">${money(p.precio)}</div>
      ${p.hay_stock ? (n ? `<div class="q"><button data-m="${p.id}">−</button><b>${n}</b><button data-a="${p.id}">+</button></div>` : `<button class="p" data-a="${p.id}">Agregar</button>`) : '<span class="sin">Sin stock</span>'}</div></article>`;
  }).join('') || '<p style="padding:14px">Pronto vamos a cargar productos.</p>';
  const items = Object.keys(cart), total = items.reduce((t, k) => t + cart[k] * L.find(p => p.id == k).precio, 0);
  $('#bar').hidden = !items.length;
  $('#tot').textContent = `${items.reduce((t, k) => t + cart[k], 0)} productos · ${money(total)}`;
}

document.addEventListener('click', e => {
  const d = e.target.dataset;
  if (d.c) cat = d.c;
  else if (d.a) cart[d.a] = (cart[d.a] || 0) + 1;
  else if (d.m) { if (--cart[d.m] <= 0) delete cart[d.m]; }
  else if (e.target.id === 'lim') cart = {};
  else if (e.target.id === 'env') {
    const lines = Object.keys(cart).map(k => { const p = L.find(x => x.id == k); return `- ${cart[k]} × ${p.nombre} (${money(cart[k] * p.precio)})`; });
    const total = Object.keys(cart).reduce((t, k) => t + cart[k] * L.find(p => p.id == k).precio, 0);
    window.open(`https://wa.me/${WA}?text=${encodeURIComponent('Hola! Quiero hacer este pedido:\n' + lines.join('\n') + '\nTotal: ' + money(total))}`, '_blank');
    return;
  } else return;
  draw();
});

init();
</script>
</body>
</html>
