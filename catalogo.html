/* Direction: specimen catalogue. Cada producto solo sobre un campo plano, mismo tamaño, nombrado sin adornos.
   Marca fija: crema del logo, tinta grafito, un verde yerba solo en la acción. Radio 0 en todo. Sin sombras, líneas ni degradados. */
:root{--cream:#fff7ea;--ink:#3b382f;--soft:#5f5b50;--tone:#efe6d3;--accent:#46683a;--dock:#33312a;--m:40px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font:400 16px/1.55 'Public Sans',system-ui,sans-serif;font-variant-numeric:tabular-nums}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button{font:inherit;color:inherit;border:0;border-radius:0;cursor:pointer;background:var(--tone);padding:0 16px;min-height:44px}
button:active{transform:scale(.97)}
nav{display:flex;align-items:center;gap:28px;padding:20px var(--m)}
.wm{font:800 26px/1 Fraunces,Georgia,serif;text-decoration:none;margin-right:auto;letter-spacing:-.01em}
nav a:not(.wm){text-decoration:none;color:var(--soft)}nav a:not(.wm):hover{color:var(--ink)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:48px;align-items:center;padding:16px var(--m) 40px;min-height:min(52vh,500px)}
h1{margin:0;font:800 clamp(52px,6.6vw,104px)/.96 Fraunces,Georgia,serif;letter-spacing:-.03em}
.hero p{margin:28px 0 32px;font-size:20px;line-height:1.5;max-width:30em}
.go{display:inline-flex;align-items:center;background:var(--accent);color:#fff;font-weight:600;padding:0 28px;min-height:52px;text-decoration:none}
.go:active{transform:scale(.97)}
.hero img{width:100%;height:auto;display:block;animation:settle 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes settle{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
#catalogo{padding:56px var(--m) 120px;scroll-margin-top:0}
h2{margin:0 0 24px;font:600 36px/1.1 'Public Sans',sans-serif;letter-spacing:-.02em}
#tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px}
#tabs button{padding:0 20px}
#tabs button[aria-pressed=true]{background:var(--ink);color:var(--cream)}
#grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 12px}
.tile{aspect-ratio:1;display:flex;align-items:flex-start;overflow:hidden;position:relative}
.tile img{width:100%;height:100%;object-fit:contain;padding:12%;mix-blend-mode:multiply;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.it:hover .tile img{transform:scale(1.05)}
.tile h3{margin:0;padding:20px;font:600 24px/1.2 'Public Sans',sans-serif;letter-spacing:-.01em}
.inf{padding:12px 0 28px}
.inf h3{margin:0;font:600 18px/1.3 'Public Sans',sans-serif}
.pr{margin:2px 0 12px;color:var(--soft)}
.add{background:var(--tone)}.add:hover{background:#e6dbc2}
.q{display:flex;align-items:center;gap:4px}.q button{width:44px;padding:0}.q b{min-width:36px;text-align:center}
.sin{color:var(--soft)}
.empty{grid-column:1/-1;padding:48px 0}
.js .it{opacity:0;transform:translateY(22px);transition:opacity .6s var(--d),transform .6s var(--d)}
.js .it.in{opacity:1;transform:none}
.js .rv{opacity:0;transform:translateY(22px);transition:opacity .6s,transform .6s}.js .rv.in{opacity:1;transform:none}
.hero div>*{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}.hero p{animation-delay:.08s}.hero .go{animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
#dock{position:fixed;left:0;right:0;bottom:0;background:var(--dock);color:var(--cream);display:flex;align-items:center;gap:12px;padding:12px var(--m);z-index:5}
#dock[hidden]{display:none}
#dock span{margin-right:auto;font-weight:600}
#dock button{background:#4a4740;color:var(--cream)}
#dock .p{background:var(--accent);color:#fff;font-weight:600}
footer{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;padding:0 var(--m) var(--m)}
.ft1{grid-column:1/9;background:var(--dock);color:var(--cream);min-height:320px;display:flex;align-items:center;justify-content:center;font:800 clamp(40px,7.4vw,120px)/1 Fraunces,Georgia,serif;letter-spacing:-.03em;text-align:center;padding:24px}
.ft2{grid-column:9/13;background:var(--accent);color:#fff;min-height:320px;padding:28px;display:flex;flex-direction:column;justify-content:space-between}
.ft2 p{margin:0;font-size:24px;line-height:1.3}
.ft2 a{font-weight:600;font-size:20px}
@media(max-width:900px){:root{--m:20px}
.hero{grid-template-columns:1fr;gap:24px;min-height:0;padding-bottom:48px}
#grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.ft1,.ft2{grid-column:1/-1;min-height:200px}
nav{gap:16px}h2{font-size:30px}.tile h3{font-size:20px;padding:14px}
#dock{flex-wrap:wrap}#dock span{flex:1 0 100%}#dock .p{flex:1}}
@media(prefers-reduced-motion:reduce){.js .it{opacity:1;transform:none;transition:none}.hero img,.hero div>*{animation:none}.js .rv{opacity:1;transform:none;transition:none}.tile img{transition:none}}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Número de WhatsApp del negocio, con código de país y sin signos. Ej: 5493531234567
const WA = '5493532448101';
const sb = supabase.createClient('https://rsmrsygckmwuuqnciukq.supabase.co', 'sb_publishable_MUZuD8FpvQwGOWl5rq4AmQ_8-QdCgwg');
const $ = s => document.querySelector(s);
const money = n => '$' + Number(n || 0).toLocaleString('es-AR');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const ORDER = ['mates', 'bombillas', 'yerbas', 'termos', 'yerberas', 'canastas'], TILE = ['#efe2c8', '#dcddcc', '#e8ded0'];
let L = [], cat = 'todos', cart = {}; const seen = new Set();
document.documentElement.classList.add('js');
$('#wa1').href = $('#wa2').href = 'https://wa.me/' + WA;

async function init() {
  const { data } = await sb.from('catalogo').select('*').order('nombre');
  L = data || []; draw();
}
const lc = p => (p.categoria || '').toLowerCase();
function draw() {
  const found = [...new Set(L.map(lc).filter(Boolean))];
  const cats = ['todos', ...ORDER.filter(c => found.includes(c)), ...found.filter(c => !ORDER.includes(c)).sort()];
  $('#tabs').innerHTML = cats.map(c => `<button aria-pressed="${c === cat}" data-c="${esc(c)}">${esc(cap(c))}</button>`).join('');
  $('#grid').innerHTML = L.filter(p => cat === 'todos' || lc(p) === cat).map((p, i) => {
    const n = cart[p.id] || 0;
    const ctl = !p.hay_stock ? '<span class="sin">Sin stock</span>' : n
      ? `<div class="q"><button data-m="${p.id}" aria-label="Quitar uno">−</button><b>${n}</b><button data-a="${p.id}" aria-label="Agregar uno">+</button></div>`
      : `<button class="add" data-a="${p.id}" aria-label="Agregar ${esc(p.nombre)}">Agregar</button>`;
    return `<article class="it${seen.has(p.id) ? ' in' : ''}" data-id="${p.id}" style="--d:${(i % 4) * 70}ms"><div class="tile" style="background:${TILE[i % 3]}">${p.foto_url ? `<img src="${esc(p.foto_url)}" alt="${esc(p.nombre)}" loading="lazy" width="600" height="600">` : `<h3>${esc(p.nombre)}</h3>`}</div>
      <div class="inf">${p.foto_url ? `<h3>${esc(p.nombre)}</h3>` : ''}<p class="pr">${money(p.precio)}</p>${ctl}</div></article>`;
  }).join('') || '<p class="empty">Pronto vamos a cargar productos.</p>';
  const ks = Object.keys(cart), total = ks.reduce((t, k) => t + cart[k] * L.find(p => p.id == k).precio, 0);
  $('#dock').hidden = !ks.length;
  $('#tot').textContent = `Tu ritual: ${ks.reduce((t, k) => t + cart[k], 0)} productos · ${money(total)}`;
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); seen.add(+e.target.dataset.id); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
  document.querySelectorAll('.it:not(.in)').forEach(el => io.observe(el));
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
  if (d.c) cat = d.c;
  else if (d.a) cart[d.a] = (cart[d.a] || 0) + 1;
  else if (d.m) { if (--cart[d.m] <= 0) delete cart[d.m]; }
  else if (b.id === 'lim') cart = {};
  else if (b.id === 'env') {
    const ks = Object.keys(cart), lines = ks.map(k => { const p = L.find(x => x.id == k); return `- ${cart[k]} × ${p.nombre} (${money(cart[k] * p.precio)})`; });
    const total = ks.reduce((t, k) => t + cart[k] * L.find(p => p.id == k).precio, 0);
    window.open(`https://wa.me/${WA}?text=${encodeURIComponent('Hola! Quiero hacer este pedido:\n' + lines.join('\n') + '\nTotal: ' + money(total))}`, '_blank');
    return;
  } else return;
  draw();
});
document.querySelectorAll('.rv').forEach(el => { const o = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { el.classList.add('in'); o.disconnect(); } })); o.observe(el); });
init();
</script>
</body>
</html>
